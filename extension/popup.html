<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SpecTest</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>SpecTest</h1>
    <div id="copied" class="copied" hidden>
      <p class="label">You copied</p>
      <p id="copied-what" class="what"></p>
      <pre id="copied-preview" class="preview"></pre>
    </div>
    <p id="lead" class="lead">Copy a function, a class or an API contract, then click the SpecTest button again.</p>
    <button id="use-copied" class="primary" type="button" hidden>Write tests</button>
    <button id="use-page" type="button">Use the API contract on this page</button>
    <button id="open" type="button">Open SpecTest to paste or upload a file</button>
    <p id="status" role="alert" hidden></p>
    <script src="lib/detect.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
