<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; }
      body { width: 440px; height: 280px; background: #171c3a; color: #fff; font: 16px/1.3 'Avenir Next', 'Segoe UI', system-ui, sans-serif; position: relative; overflow: hidden; }
      h1 { position: absolute; left: 32px; top: 34px; margin: 0; font-size: 40px; letter-spacing: -0.02em; }
      p { position: absolute; left: 32px; top: 92px; margin: 0; width: 300px; font-size: 18px; color: #c9d0f2; }
      .rows { position: absolute; left: 32px; bottom: 30px; display: grid; gap: 8px; }
      .row { display: flex; gap: 6px; align-items: center; font: 600 12px/1 ui-monospace, Menlo, Consolas, monospace; color: #9aa6e0; }
      .row b { width: 58px; font-weight: 600; }
      .row i { width: 14px; height: 14px; border-radius: 3px; border: 2px solid #6f7bb8; box-sizing: border-box; }
      .row i.on { background: #fff; border-color: #fff; }
      .row i.hot { background: #7d93ff; border-color: #7d93ff; }
    </style>
  </head>
  <body>
    <h1>SpecTest</h1>
    <p>API tests from your OpenAPI contract</p>
    <div class="rows">
      <div class="row"><b>GET</b><i class="on"></i><i></i><i></i><i class="on"></i><i class="on"></i><i></i></div>
      <div class="row"><b>POST</b><i class="on"></i><i class="on"></i><i class="on"></i><i class="hot"></i><i class="on"></i><i></i></div>
      <div class="row"><b>DELETE</b><i class="on"></i><i></i><i></i><i></i><i class="on"></i><i class="on"></i></div>
    </div>
  </body>
</html>
